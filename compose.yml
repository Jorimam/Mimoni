services:
  mimoni_db:
    image: mysql:8.0
    container_name: mimoni_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
    ports:
      - "3308:3306"
    volumes:
      - mimoni_db_data:/var/lib/mysql
    command: 
      - --default-authentication-plugin=mysql_native_password
      - --innodb_buffer_pool_size=256M
      - --innodb_log_file_size=128M
    healthcheck:
      # FIX: Use mysqladmin ping natively via CMD without hardcoding password syntax
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  api:
    build: .
    container_name: mimoni_api
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: mimoni_db           
      DB_PORT: "3306"        
    depends_on:
      mimoni_db:
        condition: service_healthy 
    ports:
      - "8000:8000"
    volumes:
      - .:/code              
    working_dir: /code       
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  mimoni_db_data:
